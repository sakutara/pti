schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  ## Purpose
  PTI Claim is a PWA mini app that helps employees and their dependents insured under a PTI group health policy (bought through the broker Marsh) look up benefits, find direct-billing facilities, prepare and send reimbursement claims, and track their status, with all personal data on the user's device. Knowledge base: /knowledge/index.md.
  
  ## Constraints (hold until the owner explicitly lifts them; record lifts in /knowledge/decisions/)
  - No backend, no server database. All data in IndexedDB on the user's device (Dexie).
  - Offline-first: every feature works offline unless its spec states why not.
  - Writes go through the outbox; the sync engine resyncs on reconnect (default adapter: local-only).
  - Mobile-first fluid UI with Tailwind v4; PC layout from `lg` (side nav, two panes).
  - Work directly on `main`: no feature branches, no git worktrees (Decision 0013). Run `npm run autobuild` after committing.
  - Static build on the local machine, deployed to GitHub Pages (`gh-pages` branch), custom domain https://pti.fiddle.vn, base path `/` (Decision 0009), hash routing.
  - Merging into `main` auto-runs a local build (git hooks in .githooks/); deploy only from a passing main.
  - Every app ships JSON export/import and requests persistent storage.
  - Controls are icon-first: icons are drawn per action as SVG by the architect (src/icons/), with accessible labels; see /knowledge/ui/iconography.md.
  
  - Exception (Decision 0003): one GitHub Action refreshes public PTI datasets in public/data and opens a PR; it never builds or deploys.
  - Local account only (Decision 0002): no login, no OAuth for identity. Google OAuth is used only for Gmail sending (0010) and later Drive sync (0008).
  - Claims are sent through the Gmail API from the browser with only the gmail.send scope, after an explicit user confirmation; mailto is the fallback (Decision 0010). No SMTP, no server, never read the mailbox.
  - Google OAuth tokens live only in memory; never persist or back them up.
  - Public pages /about/ and /privacy/ must stay accurate whenever data handling or Google scopes change (change add-public-pages).
  - The repo is public: only public PTI information, never company-internal data or personal data (Decision 0007).

  ## Language
  All artifacts are written in Vietnamese. Keep OpenSpec structural headings, SHALL/MUST keywords,
  scenario IDs and code identifiers in English. UI strings are Vietnamese, kept in src/i18n/vi.ts from day one.

  ## Tech stack
  Vite · TypeScript strict · Preact · Tailwind v4 · Dexie · vite-plugin-pwa (Workbox) · Vitest + fake-indexeddb + @testing-library/preact · Playwright.
  
  ## Conventions
  - Scenario IDs `<capability>.<behavior>.<variant>`; tests are named with them.
  - Data-writing requirements need `.offline` and `.resync` scenarios; UI requirements need `.layout.narrow`, `.layout.wide` and, for icon-only controls, `.a11y`.
  - Design and specs: Opus 5.5. Tests and code: Haiku 5.5 (`pwa-implementer`), strict TDD.

rules:
  proposal:
    - Nêu hành vi khi offline và liệt kê rõ phần ngoài phạm vi (Out of scope).
    - Liên kết tới tài liệu OKF liên quan trong /knowledge/.
  specs:
    - Scenario titles carry a dotted ID <capability>.<behavior>.<variant>.
    - Data-writing requirements include .offline and .resync scenarios; UI requirements include .layout.narrow and .layout.wide.
    - Mô tả hành vi quan sát được, không mô tả chi tiết cài đặt.
  design:
    - Ghi rõ thay đổi schema Dexie (bảng, index, version, migration) hoặc "không đổi".
    - Có bảng icon brief cho mọi control mới.
  tasks:
    - Each task lists Scenarios, Files, Test, Done when.
    - Task cuối chạy npm test, npm run build, npm run test:e2e, npm run check:okf, openspec validate --strict.
