name: refresh-pti-data

# Refreshes the PTI facility list in public/data and looks up map points for new or changed facilities (Nominatim). Commits only public/data to main when the data changed.
# It does not build, deploy, create branches or open pull requests.
on:
  schedule: [{ cron: '0 2 1 * *' }]
  workflow_dispatch: {}

permissions: { contents: write }
concurrency: { group: refresh-pti-data }

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/refresh-facilities.mjs --out public/data/facilities/pti.json --manifest public/data/manifest.json > summary.md
      - run: node scripts/geocode-facilities.mjs --facilities public/data/facilities/pti.json --out public/data/facilities/geo.json >> summary.md
      - name: Commit vào main
        run: |
          git add public/data
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "data: làm mới danh sách CSYT PTI"; echo; cat summary.md; } > message.txt
          git commit -F message.txt
          git push origin HEAD:main
